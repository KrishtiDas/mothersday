<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day Maa ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FLOATING EMOJIS -->

    <div class="float-item" style="left:5%; animation-duration:9s;">🌺</div>
    <div class="float-item" style="left:85%; animation-duration:10s;">🌸</div>
    <div class="float-item" style="left:15%; animation-duration:6s;">❤️</div>
    <div class="float-item" style="left:45%; animation-duration:5.5s;">✨</div>
    <div class="float-item" style="left:75%; animation-duration:7s;">💖</div>
    <div class="float-item" style="left:30%; animation-duration:5s;">💝</div>
    <div class="float-item" style="left:10%; animation-duration:7.5s;">🌷</div>
    <div class="float-item" style="left:25%; animation-duration:6.5s;">🦋</div>
    <div class="float-item" style="left:40%; animation-duration:8s;">💐</div>
    <div class="float-item" style="left:55%; animation-duration:6s;">🌼</div>
    <div class="float-item" style="left:65%; animation-duration:7s;">💕</div>
    <div class="float-item" style="left:80%; animation-duration:8.5s;">🌻</div>
    <div class="float-item" style="left:92%; animation-duration:5s;">🌿</div>

    <!-- SCENE -->

    <div class="scene">

        <!-- CARD 1 -->

        <div class="card active">

            <!-- FRONT -->

            <div class="side front">

                <div class="flower">🌸💐🌸</div>

                <h1>Happy Mother's Day Maa</h1>

                <p id="text1"></p>

                <div class="photo"></div>

                <p class="tap">Tap to Open 💌</p>

            </div>

            <!-- BACK -->

            <div class="side back">

                <h2>Dear Maa 💖</h2>

                <p id="text2"></p>

                <div class="heart">❤️</div>

                <p>Love You Always 💕</p>

            </div>

        </div>

        <!-- CARD 2 -->

        <div class="card">

            <!-- FRONT -->

            <div class="side front">

                <div class="flower">🌷🌷</div>

                <h1>Beautiful Memories</h1>

                <p class="tap">Tap to Open 💌</p>

            </div>

            <!-- BACK -->

            <div class="side back">

                <h2>Thank You Maa 🌸</h2>

                <p id="text3"></p>

                <div class="heart">💖</div>

                <p>Forever Grateful 💕</p>

            </div>

        </div>

        <!-- CARD 3 -->

        <div class="card">

            <div class="side poem">

                <h2>For My Maa 💕</h2>

                <p id="text4"></p>

                <div class="heart">💗</div>

                <p class="tap">Tap Again 💌</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
